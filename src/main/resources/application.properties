spring.application.name=spot-me-service
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=system

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
graphhopper.api.key=51685083-11df-43af-8193-a5d4afba84b9

# Local-only: set to true to skip TLS certificate/hostname validation for GraphHopper calls
graphhopper.ssl-insecure=false
# GraphHopper returns full route geometry (points_encoded=false); 256 KB WebClient default is too small
graphhopper.max-in-memory-bytes=16777216
